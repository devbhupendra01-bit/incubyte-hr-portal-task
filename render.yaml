services:
  - type: web
    name: employee-salary-management-system
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
